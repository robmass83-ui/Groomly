<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.22"/>
      <feComposite in2="d" operator="in" result="outline"/>
      <feGaussianBlur in="d" stdDeviation="2.5" result="b"/>
      <feOffset in="b" dy="3" result="ob"/>
      <feFlood flood-color="#000000" flood-opacity="0.45"/>
      <feComposite in2="ob" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="noteBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3A8"/><stop offset="1" stop-color="#3FA977"/>
    </linearGradient>
    <linearGradient id="noteFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="coin" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset=".35" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/>
    </radialGradient>
  
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A3D"/><stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
  <g transform="translate(14 13) scale(0.78)">
  <g filter="url(#sticker)" transform="translate(-2 -5)">
    <!-- banconota dietro -->
    <g transform="rotate(-14 56 54)">
      <rect x="12" y="30" width="86" height="48" rx="7" fill="url(#noteBack)"/>
      <rect x="18" y="36" width="74" height="36" rx="4" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>
    </g>
    <!-- banconota davanti -->
    <g transform="rotate(5 64 64)">
      <rect x="18" y="42" width="88" height="50" rx="7" fill="url(#noteFront)"/>
      <rect x="24" y="48" width="76" height="38" rx="4" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
      <circle cx="62" cy="67" r="13" fill="#fff" opacity=".9"/>
      <text x="62" y="73.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#047857">€</text>
      <circle cx="33" cy="57" r="3" fill="#fff" opacity=".55"/>
      <circle cx="91" cy="77" r="3" fill="#fff" opacity=".55"/>
    </g>
    <!-- monete -->
    <circle cx="101" cy="88" r="15" fill="url(#coin)"/>
    <circle cx="101" cy="88" r="11" fill="none" stroke="#B45309" stroke-opacity=".5" stroke-width="1.5"/>
    <circle cx="86" cy="104" r="17" fill="url(#coin)"/>
    <circle cx="86" cy="104" r="12.5" fill="none" stroke="#B45309" stroke-opacity=".55" stroke-width="1.6"/>
    <text x="86" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="16" fill="#92400E">€</text>
  </g>
</g>
</svg>
