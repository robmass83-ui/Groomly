<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 307 250" width="614" height="500">
<title>Groomly dark</title>
<style>
  /* ---------- Ingresso badge ---------- */
  .badge{transform-box:fill-box;transform-origin:center;animation:pop .8s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

  /* ---------- Cane: dondolio leggero, sempre frontale ---------- */
  .dog{transform-box:fill-box;transform-origin:50% 95%;animation:bob 2.6s ease-in-out .8s infinite}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-1.3px) rotate(-2.5deg)}
    50%{transform:translateY(0) rotate(0)}
    75%{transform:translateY(-1.3px) rotate(2.5deg)}
  }
  .ear{transform-box:fill-box;animation:earL 1.3s ease-in-out .8s infinite}
  .ear.l{transform-origin:85% 15%}
  .ear.r{transform-origin:15% 15%;animation-name:earR}
  @keyframes earL{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
  @keyframes earR{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s ease-in-out 1.6s infinite}
  @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
  .blush{animation:blush 2.6s ease-in-out .8s infinite}
  @keyframes blush{0%,100%{opacity:.45}50%{opacity:.75}}
  .tuft{transform-box:fill-box;transform-origin:50% 100%;animation:tuft 1.6s ease-in-out .8s infinite}
  @keyframes tuft{0%,100%{transform:scale(1)}50%{transform:scale(1.08,.94)}}

  /* ---------- Bollicine contorno: galleggiano ---------- */
  .ring{transform-box:fill-box;transform-origin:center;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.5px) scale(1.08)}}

  /* ---------- Bollicine che salgono dalla schiuma ---------- */
  .rise{opacity:0;transform-box:fill-box;transform-origin:center;animation:rise 3.6s ease-in infinite}
  @keyframes rise{
    0%{transform:translate(0,0) scale(.4);opacity:0}
    15%{opacity:.9}
    50%{transform:translate(3px,-28px) scale(1)}
    80%{opacity:.7}
    100%{transform:translate(-2px,-58px) scale(1.15);opacity:0}
  }

  /* ---------- Schiuma ---------- */
  .foam{animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(1.8px)}}
  .fb{transform-box:fill-box;transform-origin:50% 100%;animation:puff 2s ease-in-out infinite}
  @keyframes puff{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .dot{transform-box:fill-box;transform-origin:center;animation:popdot 2.4s ease-in-out infinite}
  @keyframes popdot{0%,100%{transform:scale(.3);opacity:0}30%,70%{transform:scale(1);opacity:1}}

  /* ---------- Sottotitolo ---------- */

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="g-clip"><circle cx="50" cy="50" r="50"/></clipPath>
  <linearGradient id="g-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ADBD9"/><stop offset="1" stop-color="#4A9FCB"/></linearGradient>
</defs>

<g class="badge">
<g transform="translate(83.5 10) scale(1.4)">
<g clip-path="url(#g-clip)">
  <rect width="100" height="100" fill="url(#g-grad)"/>

  <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.6">
    <circle class="ring" cx="20" cy="24" r="5"/>
    <circle class="ring" cx="78" cy="22" r="4" style="animation-delay:-.8s;animation-duration:3.4s"/>
    <circle class="ring" cx="86" cy="40" r="2.6" style="animation-delay:-1.6s;animation-duration:2.6s"/>
    <circle class="ring" cx="13" cy="44" r="3" style="animation-delay:-2.2s;animation-duration:3.2s"/>
  </g>

  <!-- bollicine che salgono -->
  <g fill="none" stroke="#fff" stroke-width="1.1">
    <circle class="rise" cx="18" cy="74" r="2.2" style="animation-delay:1s"/>
    <circle class="rise" cx="80" cy="72" r="2.8" style="animation-delay:1.9s;animation-duration:4.2s"/>
    <circle class="rise" cx="30" cy="70" r="1.6" style="animation-delay:2.7s;animation-duration:3.2s"/>
    <circle class="rise" cx="70" cy="70" r="1.8" style="animation-delay:3.4s"/>
    <circle class="rise" cx="10" cy="76" r="1.4" style="animation-delay:4.1s;animation-duration:3s"/>
    <circle class="rise" cx="90" cy="76" r="1.9" style="animation-delay:2.2s;animation-duration:3.8s"/>
  </g>

  <!-- cane -->
  <g class="dog">
    <g class="ear l"><ellipse cx="32" cy="44" rx="7" ry="13" transform="rotate(22 32 44)" fill="#A8683A"/></g>
    <g class="ear r"><ellipse cx="68" cy="44" rx="7" ry="13" transform="rotate(-22 68 44)" fill="#A8683A"/></g>
    <circle cx="50" cy="48" r="18" fill="#E9B57A"/>
    <ellipse class="blush" cx="38.5" cy="53" rx="3.2" ry="1.9" fill="#F2958A"/>
    <ellipse class="blush" cx="61.5" cy="53" rx="3.2" ry="1.9" fill="#F2958A"/>
    <g class="eyes">
      <circle cx="43" cy="46" r="2.6" fill="#2B2B2B"/><circle cx="57" cy="46" r="2.6" fill="#2B2B2B"/>
      <circle cx="43.8" cy="45.2" r=".9" fill="#fff"/><circle cx="57.8" cy="45.2" r=".9" fill="#fff"/>
    </g>
    <ellipse cx="50" cy="55" rx="8" ry="6" fill="#F7DDBA"/>
    <ellipse cx="50" cy="52.3" rx="3" ry="2.2" fill="#2B2B2B"/>
    <path d="M46.5 57 Q50 60.5 53.5 57" fill="none" stroke="#2B2B2B" stroke-width="1.3" stroke-linecap="round"/>
    <g class="tuft" fill="#fff"><circle cx="43" cy="31" r="5"/><circle cx="50" cy="28.5" r="6"/><circle cx="57" cy="31.5" r="4.5"/></g>
  </g>

  <!-- schiuma -->
  <g class="foam" fill="#fff">
    <rect x="-6" y="76" width="112" height="30"/>
    <circle class="fb" cx="14" cy="76" r="10"/>
    <circle class="fb" cx="30" cy="72" r="11" style="animation-delay:-.5s"/>
    <circle class="fb" cx="50" cy="73" r="12" style="animation-delay:-1s"/>
    <circle class="fb" cx="70" cy="72" r="11" style="animation-delay:-1.5s"/>
    <circle class="fb" cx="86" cy="76" r="10" style="animation-delay:-.8s"/>
    <circle class="fb" cx="-2" cy="78" r="9" style="animation-delay:-1.2s"/>
    <circle class="fb" cx="102" cy="78" r="9" style="animation-delay:-.3s"/>
    <g fill="#D6F0F5">
      <circle class="dot" cx="40" cy="82" r="3"/>
      <circle class="dot" cx="62" cy="85" r="2.4" style="animation-delay:-.9s"/>
      <circle class="dot" cx="24" cy="86" r="2" style="animation-delay:-1.7s"/>
      <circle class="dot" cx="78" cy="88" r="1.8" style="animation-delay:-.4s"/>
    </g>
  </g>
</g>
<circle cx="50" cy="50" r="48" fill="none" stroke="#fff" stroke-width="4"/>
</g>
</g>


</svg>
