<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.22"/>
      <feComposite in2="d" operator="in" result="outline"/>
      <feGaussianBlur in="d" stdDeviation="2.5" result="b"/>
      <feOffset in="b" dy="3" result="ob"/>
      <feFlood flood-color="#000000" flood-opacity="0.45"/>
      <feComposite in2="ob" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52627A"/><stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
  
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A3D"/><stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
  <g transform="translate(14 13) scale(0.78)">
  <g filter="url(#sticker)">
    <!-- carta -->
    <rect x="38" y="10" width="52" height="38" rx="6" fill="url(#card)"/>
    <rect x="46" y="18" width="13" height="10" rx="2.5" fill="#FCD34D"/>
    <path d="M50.5 18v10M46 23h13" stroke="#D97706" stroke-width="1.2"/>
    <rect x="66" y="20" width="16" height="3" rx="1.5" fill="#fff" opacity=".55"/>
    <rect x="66" y="26" width="10" height="3" rx="1.5" fill="#fff" opacity=".4"/>
    <!-- terminale -->
    <rect x="26" y="38" width="76" height="82" rx="14" fill="url(#body)"/>
    <rect x="34" y="40" width="60" height="5" rx="2.5" fill="#0F172A"/>
        <!-- schermo -->
    <rect x="35" y="50" width="58" height="27" rx="5" fill="url(#screen)"/>
    <g stroke="#047857" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M40 59 a4.5 4.5 0 0 1 0 9"/>
      <path d="M43.5 56 a7.5 7.5 0 0 1 0 15"/>
    </g>
    <text x="88" y="68" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10.5" fill="#065F46">€ 45,00</text>
    <!-- tastierino -->
    <g fill="#94A3B8">
      <rect x="38" y="84" width="14" height="8" rx="3"/><rect x="57" y="84" width="14" height="8" rx="3"/><rect x="76" y="84" width="14" height="8" rx="3"/>
      <rect x="38" y="96" width="14" height="8" rx="3"/><rect x="57" y="96" width="14" height="8" rx="3"/><rect x="76" y="96" width="14" height="8" rx="3"/>
    </g>
    <rect x="38" y="108" width="14" height="8" rx="3" fill="#F87171"/>
    <rect x="57" y="108" width="14" height="8" rx="3" fill="#FBBF24"/>
    <rect x="76" y="108" width="14" height="8" rx="3" fill="#34D399"/>
  </g>
</g>
</svg>
