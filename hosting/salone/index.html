<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salone — Groomly</title>
  <style>
    :root { color-scheme: light; --bg: #eef3f7; --tx: #2C4560; --card: #fff; --line: #dfe8ef; }
    body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Pagina del salone</h1>
      <p>Il titolo che i social leggono arriva dalla funzione <code>saloneInfo</code>, con il nome del salone e senza partita IVA né codice fiscale se il salone non li mostra.</p>
    </div>
  </main>
</body>
</html>
