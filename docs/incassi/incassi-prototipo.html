<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groomly · Incassi (prototipo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<!--
  PROTOTIPO PER CURSOR — Groomly · Incassi (1A riquadro Home + 1B pagina Incassi + 4A Altro + 4B Report + 4C Esporta)
  Spec: incassi-spec.md (stessa cartella). Token, misure e font = src/theme/tokens.css, sizes.ts, theme.ts.
  Interazioni da replicare: riquadro → pagina · Segmented periodo · ‹ › e swipe · «Oggi» · tap barra = fumetto
  · tap giorno (settimana) → Giorno · tap «Persi» → foglio · occhio = importi nascosti (anche in Home) · tieni premuto l'importo = sbircia.
-->
<style>
:root{--bg:#ECEFF4;--card:#FFFFFF;--surf:#F5F7FA;--surf3:#FFFFFF;--line:#E1E6EE;--line2:#D3DAE5;--tx:#141B2B;--tx2:#525D71;--tx3:#8A94A6;--pri:#3A5BA0;--pri-solid:#3A5BA0;--pri-s:#E6ECF8;--pri-ink:#2C4785;--ok:#15905B;--ok-s:#E2F4EA;--warn:#A86C0E;--warn-s:#FCF0D8;--bad:#C93D33;--bad-s:#FBE6E4;
--sh-1:0 1px 2px rgba(22,34,64,.06),0 1px 1px rgba(22,34,64,.03);--sh-2:0 1px 2px rgba(22,34,64,.05),0 6px 16px -6px rgba(22,34,64,.12);--sh-3:0 2px 6px rgba(22,34,64,.06),0 18px 40px -12px rgba(22,34,64,.28);--scrim:rgba(18,26,42,.42);
--bar-a:#6F8BCB;--bar-b:#3A5BA0;--bar-sa:#4F6FC0;--bar-sb:#2C4785;--prev-a:#EEF2FA;--prev-b:#E0E8F6;--prev-line:#8EA5D6;--grid:#E6EAF0;--tip-bg:#141B2B;--tip-tx:#FFFFFF;--tip-sub:#C9D6EE}
[data-theme="dark"]{--bg:#0C111A;--card:#151C28;--surf:#1B2331;--surf3:#232C3C;--line:#242E3F;--line2:#2F3A4E;--tx:#E9EDF4;--tx2:#A6B0C2;--tx3:#6E798D;--pri:#8AA4E8;--pri-solid:#4F6FC0;--pri-s:rgba(138,164,232,.15);--pri-ink:#B3C6F4;--ok:#4FCB8F;--ok-s:rgba(79,203,143,.14);--warn:#F0B44C;--warn-s:rgba(240,180,76,.14);--bad:#F07A70;--bad-s:rgba(240,122,112,.14);
--sh-1:0 0 0 1px rgba(255,255,255,.02),0 1px 2px rgba(0,0,0,.4);--sh-2:inset 0 1px 0 rgba(255,255,255,.04),0 8px 20px -10px rgba(0,0,0,.7);--sh-3:0 24px 48px -12px rgba(0,0,0,.8);--scrim:rgba(0,0,0,.55);
--bar-a:#4F6FC0;--bar-b:#3A5BA0;--bar-sa:#8AA4E8;--bar-sb:#4F6FC0;--prev-a:rgba(138,164,232,.06);--prev-b:rgba(138,164,232,.14);--prev-line:rgba(138,164,232,.5);--grid:#242E3F;--tip-bg:#E9EDF4;--tip-tx:#141B2B;--tip-sub:#525D71}
*{box-sizing:border-box}
html,body{margin:0;background:#D9DEE6;font-family:Inter,system-ui,sans-serif;font-size:12.5px;line-height:1.35;font-variant-numeric:tabular-nums;color:var(--tx)}
button{font:inherit;color:inherit;cursor:pointer}
.proto{display:flex;gap:28px;padding:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.side{width:230px;display:flex;flex-direction:column;gap:6px;position:sticky;top:20px;color:#141B2B}
.side h1{font-size:15px;margin:0}.side p{margin:0 0 6px;font-size:11.5px;color:#525D71}
.side button{height:34px;border-radius:9px;border:1px solid #D3DAE5;background:#fff;text-align:left;padding:0 12px;font-weight:600}
.side button[aria-pressed="true"]{background:#3A5BA0;color:#fff;border-color:#3A5BA0}
.phone{width:390px;height:844px;border-radius:38px;background:#111;padding:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}.scroll::-webkit-scrollbar{width:0}
.hdr{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.hdr h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.15}.hdr small{display:block;font-size:10.5px;color:var(--tx3);font-weight:500}
.hbtn{width:30px;height:30px;border-radius:9px;border:0;background:var(--surf);color:var(--tx2);display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);overflow:hidden}
.sect{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase;margin:0}
.sect:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--pri)}
.row{display:flex;align-items:center;gap:8px;padding:7px 9px;min-height:40px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;transition:background .3s}
.row:first-child{border-top:0}.row.flash{background:var(--pri-s)}
.meta{font-size:10.5px;color:var(--tx3)}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{flex:1;height:26px;border:0;border-radius:6px;background:transparent;font-weight:600;font-size:11px;color:var(--tx2)}
.seg button[aria-checked="true"]{background:var(--surf3);color:var(--tx);box-shadow:var(--sh-1),0 0 0 1px var(--line)}
.nbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--tx2);display:grid;place-items:center}
.nbtn:disabled{opacity:.4;cursor:default}
.pill{height:22px;padding:0 8px;border-radius:999px;font-weight:700;font-size:11px;display:inline-flex;align-items:center;white-space:nowrap}
.kpi{padding:7px 9px;text-align:left;border:1px solid var(--line)}.kpi small{display:block;font-size:10.5px;color:var(--tx3);font-weight:600}.kpi b{font-size:16px;font-weight:700}
/* grafico */
.chart{position:relative;height:196px;margin-top:6px;touch-action:pan-y}
.plot{position:absolute;left:30px;right:0;top:46px;bottom:0}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--grid)}.gl.zero{border-top:1px solid var(--line2)}
.gl span{position:absolute;left:-30px;top:-7px;width:24px;text-align:right;font-size:9.5px;color:var(--tx3)}
.avg{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--tx3);z-index:1;pointer-events:none}
.avg span{position:absolute;right:0;top:-9px;height:16px;padding:0 6px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:9.5px;font-weight:700;color:var(--tx2);display:inline-flex;align-items:center}
.bars{position:absolute;inset:0;display:flex;gap:6px}
.bar{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar .v{font-size:9.5px;font-weight:600;color:var(--tx3);margin-bottom:3px}
.bar .p,.bar .i{display:block;width:100%;max-width:28px;transition:opacity .15s,height .25s ease-out}
.bar .i{background:linear-gradient(180deg,var(--bar-a),var(--bar-b))}
.bar.sel .i{background:linear-gradient(180deg,var(--bar-sa),var(--bar-sb))}
.bar .p{background:repeating-linear-gradient(135deg,var(--prev-a) 0 4px,var(--prev-b) 4px 8px)}
.dim .bar:not(.sel) .p,.dim .bar:not(.sel) .i{opacity:.5}
.tip{position:absolute;z-index:2;white-space:nowrap;background:var(--tip-bg);color:var(--tip-tx);border-radius:9px;padding:6px 9px;font-size:10px;line-height:1.35;text-align:left;box-shadow:0 8px 18px -8px rgba(20,27,43,.6);pointer-events:none}
.tip b{display:block;font-size:11.5px}.tip span{color:var(--tip-sub)}
.xl{display:flex;gap:6px;margin:6px 0 0 30px}
.xl div{flex:1;min-width:0;text-align:center;font-size:10.5px;line-height:1.2;font-weight:600;color:var(--tx2)}
.xl div small{display:block;font-size:9.5px;font-weight:500;color:var(--tx3)}
.xl .today{font-weight:800;color:var(--pri)}.xl .on{font-weight:700;color:var(--tx)}
.legend{display:flex;gap:14px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:10.5px;color:var(--tx2);align-items:center}
.legend i{display:inline-block;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.bar .p,.bar .i{transition:none}}
/* home */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 8px 4px;display:flex;flex-direction:column;gap:2px;text-align:left;color:inherit;text-decoration:none}
.tile .t{width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.tile b{font-size:18px;font-weight:700;line-height:1.1}.tile span{font-size:10.5px;font-weight:600;color:var(--tx3)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:6px;font-size:10.5px;font-weight:600;background:#E2EFFB;color:#2775C9}
[data-theme="dark"] .chip{background:rgba(125,182,242,.14);color:#7DB6F2}
.nav{position:absolute;left:4px;right:4px;bottom:12px;height:72px;border-radius:24px;background:var(--card);box-shadow:0 12px 28px rgba(28,42,68,.14);display:flex;align-items:center;justify-content:space-around;font-size:10px;color:var(--tx3)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;z-index:21;padding:6px 12px 18px;box-shadow:var(--sh-3)}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 8px}
.fchip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--tx2);font-weight:600;font-size:11.5px;white-space:nowrap}
.fchip[aria-checked="true"]{background:var(--pri-s);border-color:transparent;color:var(--pri-ink)}
.k4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.k4>div{padding:8px 10px}.k4 small{display:block;font-size:10.5px;color:var(--tx3);font-weight:600}.k4 b{display:block;font-size:18px;font-weight:800}.k4 i{font-style:normal;font-size:10.5px;font-weight:700}
.fmt{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line2);text-align:left}
.fmt[aria-checked="true"]{border:2px solid var(--pri);box-shadow:0 0 0 3px rgba(58,91,160,.14)}
.sw{width:38px;height:22px;border-radius:11px;border:0;padding:3px;display:flex;background:var(--line2);flex:none}.sw i{width:16px;height:16px;border-radius:8px;background:#fff}.sw[aria-checked="true"]{background:var(--pri-solid);justify-content:flex-end}
.sw:disabled{opacity:.5}
</style>
</head>
<body>
<div class="proto">
  <aside class="side">
    <h1>Groomly · Incassi</h1>
    <p>Prototipo 1A + 1B. Oggi = martedì 13 ottobre 2026, ore 15:05. Prova: tocca il riquadro, cambia periodo, tocca le barre, ‹ ›, swipe sul grafico, tocca un giorno, tocca «Persi», l'occhio, tieni premuto l'importo.</p>
    <button data-go="home">1A · Home</button>
    <button data-go="incassi">1B · Incassi</button>
    <button data-go="altro">4A · Altro</button>
    <button data-go="report">4B · Report</button>
    <button data-go="report" data-export="1">4C · Esporta</button>
    <div style="height:6px"></div>
    <button id="theme">Tema scuro: no</button>
  </aside>
  <div class="phone"><div class="screen" id="screen"></div></div>
</div>
<script>
/* ---------- dati di prova (spec §11) ---------- */
const TODAY = 13;
const WEEK = [ // [label, giorno, nome, incassato, previsto, completati, previsti]
  ['Lun',12,'Lunedì 12',145,0,4,0],['Mar',13,'Martedì 13',110,65,3,2],['Mer',14,'Mercoledì 14',0,160,0,5],
  ['Gio',15,'Giovedì 15',0,90,0,3],['Ven',16,'Venerdì 16',0,120,0,4],['Sab',17,'Sabato 17',0,0,0,0]];
const DAY13 = [ // ora, cane, servizio, importo, stato
  ['09:00','Zeus','Bagno + taglio',55,'completato'],['11:30','Micio','Bagno',25,'completato'],['12:15','Iris','Bagno',30,'completato'],
  ['15:30','Luna','Bagno',30,'previsto'],['17:00','Otto','Taglio / tosatura',35,'previsto']];
const MONTH = [['1–4','sett. 1','1 – 4 ottobre',765,0],['5–11','sett. 2','5 – 11 ottobre',820,0],['12–18','sett. 3','12 – 18 ottobre',255,435],['19–25','sett. 4','19 – 25 ottobre',0,445],['26–31','sett. 5','26 – 31 ottobre',0,240]];
const SERVIZI = [['Bagno + taglio','18 volte',990],['Bagno','24 volte',640],['Taglio / tosatura','5 volte',170],['Extra','9 volte',40]];
const PERSI = [['Fido','gio 15 ott','disdetto dal cliente',35]];

/* ---------- stato ---------- */
const S = { screen:'home', periodo:'settimana', offset:0, day:TODAY, sel:{}, hide:false, peek:false, sheet:false, flash:null };
const eur = n => S.hide && !S.peek ? '•••' : n.toLocaleString('it-IT') + ' €';
const eurAlways = n => n.toLocaleString('it-IT') + ' €';

function nice(v){ if(!v) return [25,100]; for(const st of [25,50,100,200,250,500,1000,2000]) if(Math.ceil(v/st)<=4) return [st,Math.ceil(v/st)*st]; return [2000,Math.ceil(v/2000)*2000]; }
function seeded(n){ let x=Math.sin(n*99.1)*10000; return x-Math.floor(x); }

/* Costruisce il riepilogo del periodo (in app: lib/earnings.ts summarize) */
function summary(){
  const p=S.periodo, o=S.offset;
  if(p==='settimana'){
    const rows = o===0 ? WEEK : WEEK.map((r,i)=>{ const v=Math.round((60+seeded(o*7+i)*120)/5)*5; return o<0?[r[0],r[1]+o*7,'',i===5?0:v,0,i===5?0:3,0]:[r[0],r[1]+o*7,'',0,i===5?0:v,0,i===5?0:3]; });
    const fmtDay = d => { const m = d>31 ? ['nov',d-31] : d<1 ? ['set',d+30] : ['ott',d]; return m; };
    const b = rows.map((r,i)=>{ const [m,dd]=fmtDay(r[1]); const names=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
      return { key:'w'+i, label:r[0], sub:String(dd), title:`${names[i]} ${dd}${m!=='ott'?' '+m:''}${o===0&&r[1]===TODAY?' · oggi':''}`, inc:r[3], prev:r[4], today:o===0&&r[1]===TODAY, day:r[1], comp:r[5], np:r[6] }; });
    const [s0,]=fmtDay(rows[0][1]), [s1,]=fmtDay(rows[5][1]+1);
    const titolo = o===0 ? '12 – 18 ottobre' : `${fmtDay(rows[0][1])[1]} ${s0==='ott'?'':s0} – ${fmtDay(rows[0][1]+6)[1]} ${fmtDay(rows[0][1]+6)[0]==='ott'?'ottobre':fmtDay(rows[0][1]+6)[0]}`.replace('  ',' ');
    const inc=b.reduce((t,x)=>t+x.inc,0), prev=b.reduce((t,x)=>t+x.prev,0), comp=b.reduce((t,x)=>t+x.comp,0), np=b.reduce((t,x)=>t+x.np,0);
    return { titolo, inc, prev, persi:o===0?35:0, apps:o===0?`${comp} di ${comp+np}`:o<0?String(comp):`0 di ${np}`, media:comp?Math.round(inc/comp):null,
      delta:o===0?12:o<0?Math.round((seeded(o)-.4)*30):null, vs:'vs sett. scorsa', buckets:b, defSel:o===0?1:b.reduce((bi,x,i,a)=>x.inc+x.prev>a[bi].inc+a[bi].prev?i:bi,0),
      lista:{titolo:'Per giorno', righe:b.filter(x=>x.inc+x.prev>0).map(x=>({key:x.key, t:x.title, s:[x.comp?`${x.comp} completati`:'',x.np?`${x.np} previsti`:''].filter(Boolean).join(' · '), v:x.inc||x.prev, muted:!x.inc, go:x.day}))},
      daChiudere:null };
  }
  if(p==='giorno'){
    const d=S.day+o;
    if(d===TODAY){
      const b=DAY13.map((r,i)=>({key:'d'+i,label:r[0].slice(0,2).replace(/^0/,''),sub:'',title:`Ore ${+r[0].slice(0,2)} · ${r[1]}`,inc:r[4]==='completato'?r[3]:0,prev:r[4]==='previsto'?r[3]:0,today:false}));
      return { titolo:'Oggi · mar 13 ottobre', inc:110, prev:65, persi:0, apps:'3 di 5', media:37, delta:18, vs:'vs mar scorso', buckets:b, defSel:2,
        lista:{titolo:'Appuntamenti di oggi', righe:DAY13.map((r,i)=>({key:'d'+i,t:`${r[0]} · ${r[1]}`, s:`${r[2]} · ${r[4]}`, v:r[3], muted:r[4]!=='completato', ok:r[4]==='completato'}))}, daChiudere:null };
    }
    const w=WEEK.find(r=>r[1]===d); const names=['dom','lun','mar','mer','gio','ven','sab']; const wd=names[((d-13)%7+7+2)%7];
    const tot = w ? (w[3]||w[4]) : (d<TODAY ? Math.round((40+seeded(d)*120)/5)*5 : 0);
    const n = w ? (w[5]||w[6]) : (tot?3:0); const past=d<TODAY;
    const each = n? Math.round(tot/n):0;
    const b=Array.from({length:n},(_,i)=>({key:'x'+i,label:String(9+i*2),sub:'',title:`Ore ${9+i*2}`,inc:past?each:0,prev:past?0:each,today:false}));
    return { titolo:`${wd} ${d} ottobre`, inc:past?tot:0, prev:past?0:tot, persi:0, apps:past?String(n):`0 di ${n}`, media:past&&n?each:null, delta:null, vs:'', buckets:b, defSel:0,
      lista:{titolo:`Appuntamenti di ${wd} ${d}`, righe:b.map((x,i)=>({key:x.key,t:`${String(9+i*2).padStart(2,'0')}:00 · Cane ${i+1}`, s:past?'completato':'previsto', v:each, muted:!past, ok:past}))}, daChiudere:null };
  }
  /* mese */
  if(o===0){ const b=MONTH.map((r,i)=>({key:'m'+i,label:r[0],sub:r[1],title:r[2],inc:r[3],prev:r[4],today:i===2}));
    return { titolo:'Ottobre 2026', inc:1840, prev:1120, persi:140, apps:'48 di 77', media:38, delta:8, vs:'vs settembre', buckets:b, defSel:2,
      lista:{titolo:'Per servizio', righe:SERVIZI.map((r,i)=>({key:'s'+i,t:r[0],s:r[1],v:r[2]}))}, daChiudere:null }; }
  const mesi=['Agosto','Settembre','Ottobre','Novembre','Dicembre']; const name=mesi[2+o]||'Mese';
  const past=o<0; const b=[1,2,3,4,5].map(i=>{ const v=Math.round((500+seeded(o*5+i)*400)/10)*10; return {key:'m'+i,label:'S'+i,sub:'',title:`Settimana ${i}`,inc:past?v:0,prev:past?0:Math.round(v*.3),today:false}; });
  const inc=b.reduce((t,x)=>t+x.inc,0), prev=b.reduce((t,x)=>t+x.prev,0);
  return { titolo:`${name} 2026`, inc, prev, persi:past?95:0, apps:past?'71':'0 di 18', media:past?Math.round(inc/71):null, delta:past?Math.round((seeded(o)-.5)*20):null, vs:'vs mese prima', buckets:b, defSel:b.reduce((bi,x,i,a)=>x.inc>a[bi].inc?i:bi,0),
    lista:{titolo:'Per servizio', righe:SERVIZI.map((r,i)=>({key:'s'+i,t:r[0],s:'',v:Math.round(r[2]*(past?inc/1840:0))}))}, daChiudere:null };
}

/* ---------- grafico (in app: components/earnings/EarningsChart.tsx) ---------- */
function chartHTML(sm){
  const b=sm.buckets; const n=b.length;
  if(!n){ S._avg=0; return `<div class="chart"><div class="plot">${[0,25,50,75,100].map(v=>`<div class="gl ${v?'':'zero'}" style="bottom:${v}%"></div>`).join('')}
    <div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3)">Nessun appuntamento in questo periodo</div></div></div>`; }
  const max=Math.max(...b.map(x=>x.inc+x.prev),1); const [step,top]=nice(max);
  const done=b.filter(x=>x.inc>0); const avg=done.length?Math.round(done.reduce((t,x)=>t+x.inc,0)/done.length):0; S._avg=avg;
  const key=S.periodo+S.offset+S.day; const sel=S.sel[key]??sm.defSel;
  let grid=''; for(let v=0;v<=top;v+=step) grid+=`<div class="gl ${v?'':'zero'}" style="bottom:${v/top*100}%"><span>${S.hide&&!S.peek?'':(v?v+'€':'0')}</span></div>`;
  const bars=b.map((x,i)=>{ const isSel=i===sel, tot=x.inc+x.prev;
    const align=i===0?'left:0':i===n-1?'right:0':'left:50%;transform:translateX(-50%)';

MESE_TOT.forEach((tot,m)=>{ let left=tot; const days=new Date(2026,m+1,0).getDate(); const lastDay=m===9?13:days; let d=1;
  while(left>0){ const dt=new Date(2026,m,d); if(dt.getDay()===0){d=d>=lastDay?1:d+1;continue;}
    let sv=SERV[Math.floor(rnd()*SERV.length)]; let imp=sv[1]; if(imp>left||left-imp<20&&left-imp>0) imp=left;

function exRange(){ const e=S.ex;
  if(e.kind==='mese') return {from:new Date(e.y,e.m,1),to:new Date(e.y,e.m+1,1),title:`${MESI[e.m]} ${e.y}`,file:`${e.y}-${String(e.m+1).padStart(2,'0')}`};

  const a=new Date(e.from), b=new Date(e.to); b.setDate(b.getDate()+1);
  return {from:a,to:b,title:`${a.toLocaleDateString('it-IT',{day:'numeric',month:'short'})} – ${new Date(e.to).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}`,file:`${e.from}_${e.to}`}; }
function exData(){ const r=exRange(); const rows=APP.filter(a=>a.d>=r.from&&a.d<r.to); const tot=rows.reduce((t,a)=>t+a.imp,0);
  const giorni=new Set(rows.map(a=>a.d.toDateString())).size; const ps={}; rows.forEach(a=>a.serv.split(', ').forEach((s,i,arr)=>{ps[s]=ps[s]||{n:0,v:0};ps[s].n++;ps[s].v+=a.imp/arr.length;}));
  const perServ=Object.entries(ps).sort((a,b)=>b[1].v-a[1].v).map(([k,x])=>[k,x.n,Math.round(x.v*100)/100]);
  const long=(r.to-r.from)>40*864e5; const grp={};
  rows.forEach(a=>{ let k; if(long) k=MESI[a.d.getMonth()]+' '+a.d.getFullYear(); else { const mon=new Date(a.d); mon.setDate(a.d.getDate()-((a.d.getDay()+6)%7)); const st=mon<r.from?r.from:mon; const en=new Date(mon); en.setDate(mon.getDate()+6); const en2=en>=r.to?new Date(r.to-864e5):en; k=`${st.getDate()} – ${en2.getDate()} ${en2.toLocaleDateString('it-IT',{month:'short'})}`;} grp[k]=grp[k]||{n:0,v:0}; grp[k].n++; grp[k].v+=a.imp; });
  const missed=MANCATI.filter(a=>a.d>=r.from&&a.d<r.to);
  return {r,rows,tot,giorni,perServ,perGrp:Object.entries(grp).map(([k,x])=>[k,x.n,x.v]),grpLabel:long?'Per mese':'Per settimana',missed,long}; }

function toCsv(x){ const e=S.ex.inc, q=v=>/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v, L=[];
  if(e.biz){ L.push(`Attività;${q(BIZ.nome)}`,`P. IVA;${BIZ.piva}`,`Periodo;${dd(x.r.from)} - ${dd(new Date(x.r.to-864e5))}`,''); }
  if(e.det){ L.push('Data;Ora;Cane;Proprietario;Servizi;Durata (min);Importo (€);Stato'+(e.manc?';Importo mancato (€)':''));
    x.rows.forEach(a=>L.push([dd(a.d),hh(a.d),q(a.cane),q(a.prop),q(a.serv),a.dur,f2(a.imp).replace(/\./g,''),'completato'].join(';')+(e.manc?';':'')));
    if(e.manc) x.missed.forEach(a=>L.push([dd(a.d),hh(a.d),q(a.cane),q(a.prop),'','', '0,00',a.mot,f2(a.imp)].join(';')));

  if(e.riep){ L.push('','Per servizio','Servizio;Volte;Importo (€)'); x.perServ.forEach(s=>L.push(`${q(s[0])};${s[1]};${f2(s[2]).replace(/\./g,'')}`));
    L.push('',x.grpLabel,(x.long?'Mese':'Settimana')+';Appuntamenti;Importo (€)'); x.perGrp.forEach(s=>L.push(`${q(s[0])};${s[1]};${f2(s[2]).replace(/\./g,'')}`)); }
  return '﻿'+L.join('\r\n'); }

async function doExport(kind){ const x=exData(); if(!x.rows.length) return; S.ex.busy=true; render();

    else { blob=new Blob([toCsv(x)],{type:'text/csv;charset=utf-8'}); name=`Groomly_Incassi_${x.r.file}.csv`; }
    const file=new File([blob],name,{type:blob.type});
    if(kind==='invia'&&navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:'Riepilogo incassi'});
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),60000); }

/* ---------- render + eventi ---------- */
const scr=document.getElementById('screen');
function render(){ scr.innerHTML = ({home,incassi,altro,report}[S.screen])() + (S.toast?`<div style="position:absolute;left:12px;right:12px;bottom:24px;z-index:40;background:#141B2B;color:#fff;border-radius:10px;padding:10px 12px;font-weight:600">${S.toast}</div>`:'');
  document.querySelectorAll('.side [data-go]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.go===S.screen));
  const big=document.getElementById('big'); if(big){ let t; const up=()=>{clearTimeout(t); if(S.peek){S.peek=false;render();}};
    big.onpointerdown=()=>{ if(!S.hide) return; t=setTimeout(()=>{S.peek=true;render();},500); }; big.onpointerup=up; big.onpointerleave=up; }
  const ch=document.getElementById('chart'); if(ch){ let x0=null,y0=null;
    ch.onpointerdown=e=>{x0=e.clientX;y0=e.clientY}; ch.onpointerup=e=>{ if(x0==null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
      if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)){ step(dx<0?1:-1); } };
    ch.onkeydown=e=>{ if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return; const sm=summary(); const k=S.periodo+S.offset+S.day; const cur=S.sel[k]??sm.defSel;
      S.sel[k]=Math.max(0,Math.min(sm.buckets.length-1,cur+(e.key==='ArrowRight'?1:-1))); render(); document.getElementById('chart')?.focus(); }; }
}
function step(dir){ const nb=document.querySelector('[data-act="next"]'); if(dir>0&&nb&&nb.disabled) return; S.offset+=dir; S.flash=null; render(); }
document.addEventListener('click',e=>{ const t=e.target.closest('button,[data-act]'); if(!t) return; const ds=t.dataset;
  if(ds.go){ S.screen=ds.go; if(ds.p){S.periodo=ds.p;S.offset=0;S.day=TODAY;} S.sheet=false; S.ex.open=!!ds.export; render(); return; }
  if(ds.rep){ S.rep=ds.rep; render(); return; }
  if(ds.exk){ S.ex.kind=ds.exk; render(); return; }
  if(ds.exfmt){ S.ex.fmt=ds.exfmt; render(); return; }
  if(ds.inc){ S.ex.inc[ds.inc]=!S.ex.inc[ds.inc]; render(); return; }
  if(ds.p){ S.periodo=ds.p; S.offset=0; S.flash=null; render(); return; }
  if(ds.bar!==undefined){ const sm=summary(); const k=S.periodo+S.offset+S.day; S.sel[k]=+ds.bar; const bk=sm.buckets[+ds.bar];
    const match=sm.lista.righe.find(r=>r.key===bk.key); S.flash=match?match.key:null; render(); setTimeout(()=>{S.flash=null;render();},1000); return; }
  if(ds.day){ S.periodo='giorno'; S.day=+ds.day; S.offset=0; render(); return; }
  switch(ds.act){ case 'eye': S.hide=!S.hide; render(); break; case 'prev': step(-1); break; case 'next': step(1); break;
    case 'oggi': S.offset=0; S.day=TODAY; render(); break;
    case 'export': S.ex.open=true; render(); break; case 'exclose': S.ex.open=false; render(); break;
    case 'exprev': if(S.ex.kind==='mese'){ if(S.ex.m===0){S.ex.m=11;S.ex.y--;} else S.ex.m--; } else S.ex.y--; render(); break;
    case 'exnext': if(S.ex.kind==='mese'){ if(S.ex.m===11){S.ex.m=0;S.ex.y++;} else S.ex.m++; } else S.ex.y++; render(); break;
    case 'exsave': doExport('salva'); break; case 'exsend': doExport('invia'); break; case 'persi': S.sheet=true; render(); break; case 'close': S.sheet=false; render(); break; }
});
document.addEventListener('change',e=>{ const k=e.target.dataset.exf; if(k){ S.ex[k]=e.target.value; if(S.ex.to<S.ex.from) S.ex.to=S.ex.from; render(); } });
document.getElementById('theme').onclick=e=>{ const d=document.documentElement.dataset.theme!=='dark'; document.documentElement.dataset.theme=d?'dark':'light'; e.target.textContent='Tema scuro: '+(d?'sì':'no'); };
render();
</script>
